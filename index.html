<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>MQTT 控制介面</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.0/mqttws31.min.js"></script>
</head>
<body>
  <h2>設備控制</h2>
  <button onclick="sendCommand('on')">ON</button>
  <button onclick="sendCommand('off')">OFF</button>

  <script>
    const clientID = "webClient_" + Math.floor(Math.random() * 10000);
    const client = new Paho.MQTT.Client("broker.mqttgo.io", 8084, clientID);

    client.connect({
      onSuccess: () => console.log("✅ 已連接到 MQTT broker (8084, SSL)"),
      useSSL: true
    });

    function sendCommand(command) {
      const topic = "MT901027/TEST";
      const message = new Paho.MQTT.Message(command);
      message.destinationName = topic;
      client.send(message);
      console.log("📤 發送: " + command);
    }
  </script>
</body>
</html>
